name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit and integration tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Run deterministic evaluation
        run: |
          PYTHONPATH=src python -m issuelens eval \
            --manifest evals/manifest.json \
            --run-dir /tmp/issuelens-eval
      - name: Upload evaluation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issuelens-evaluation-python-${{ matrix.python-version }}
          path: /tmp/issuelens-eval/
          if-no-files-found: error
          retention-days: 14
