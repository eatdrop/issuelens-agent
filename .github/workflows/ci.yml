name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit and integration tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Run deterministic evaluation
        run: |
          PYTHONPATH=src python -m issuelens eval \
            --manifest evals/manifest.json \
            --run-dir /tmp/issuelens-eval
      - name: Upload evaluation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issuelens-evaluation-python-${{ matrix.python-version }}
          path: /tmp/issuelens-eval/
          if-no-files-found: error
          retention-days: 14

  shadow-validation:
    runs-on: ubuntu-latest
    env:
      SHADOW_IMAGE: python:3.12.10-slim@sha256:fd95fa221297a88e1cf49c55ec1828edd7c5a428187e67b5d1805692d11588db
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Pull the pinned Python shadow image
        run: docker pull "$SHADOW_IMAGE"
      - name: Prove fail-before and pass-after in Docker
        run: |
          proposal_json="$(PYTHONPATH=src python -m issuelens patch-proposal \
            --repo fixtures/calculator_repo \
            --diff evals/patches/division_by_zero.diff)"
          proposal_hash="$(python -c 'import json,sys; print(json.load(sys.stdin)["proposal_hash"])' \
            <<< "$proposal_json")"
          PYTHONPATH=src python -m issuelens patch-validate \
            --repo fixtures/calculator_repo \
            --diff evals/patches/division_by_zero.diff \
            --run-id ci-shadow-validation \
            --approved-by github-actions \
            --approve-proposal-hash "$proposal_hash" \
            --audit-dir /tmp/issuelens-shadow-audit \
            --reproduction-tests evals/reproduction/division_by_zero \
            --hidden-tests evals/hidden/division_by_zero \
            --docker-image "$SHADOW_IMAGE"
      - name: Upload shadow-validation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issuelens-shadow-validation
          path: /tmp/issuelens-shadow-audit/
          if-no-files-found: error
          retention-days: 14
